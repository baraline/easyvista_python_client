[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Hatchling decides sdist contents from the ROOT .gitignore only — it reads
# neither nested .gitignore files nor the user's global ignore file. Relying on
# that default previously swept local agent state and internal notes into the
# artifact, so the manifest is pinned explicitly here: `exclude` below is a
# belt-and-braces backstop, and the sdist `include` further down is an
# allowlist. A PyPI upload cannot be taken back, so nothing ships by accident.
[tool.hatch.build]
ignore-vcs = false
skip-excluded-dirs = true
exclude = [
    "__pycache__/",
    "*.py[cod]",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
    "build/",
    "dist/",
    "*.egg-info/",
    "docs/_build/",
    ".venv/",
    "venv/",
    ".env",
    ".env.*",
    "secrets/",
    ".claude/",
    ".superpowers/",
    "docs/superpowers/",
    "scripts/",
    # Unit tests now live inside `easyvista_python_client/` (see the sdist
    # comment below), so the `packages = ["easyvista_python_client"]` wheel
    # boundary no longer keeps them out on its own. These two globs are the
    # sole mechanism excluding them from BOTH the wheel and the sdist -- delete
    # or narrow one and the next build ships the test suite to PyPI, which
    # cannot be un-uploaded. CI's `build-audit` job (.github/workflows/ci.yml)
    # builds both artifacts and asserts neither contains a tests/ or testing/
    # path, so a regression here fails CI instead of surfacing after publish.
    "**/tests/",
    "**/testing/",
]

[project]
name = "easyvista-python-client"
version = "0.1.0"
description = "Typed Python client for the EasyVista Service Manager REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "easyvista-python-client contributors" }]
keywords = ["easyvista", "itsm", "service-manager", "api", "client", "rest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "tenacity>=8.2",
    "typing-extensions>=4.7; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/baraline/easyvista_python_client"
Documentation = "https://easyvista-python-client.readthedocs.io/en/latest/"
Issues = "https://github.com/baraline/easyvista_python_client/issues"
Source = "https://github.com/baraline/easyvista_python_client"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "numpydoc>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "vulture>=2.11",
    "pre-commit>=4.0",
    "sphinx>=7.2,<8.2",
    "sphinx-rtd-theme>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "twine>=5.1",
    # Exact-pinned, not a range: unasync_build.py --check is a byte-equality
    # gate between _async/ and the checked-in _sync/, and a different
    # generator version can regenerate byte-different-but-equally-"correct"
    # output (e.g. via a tokenize_rt whitespace-reconstruction change, which
    # unasync 0.6.0 depends on with no version bound of its own -- see the
    # matching pin below). That would fail --check on an untouched PR with a
    # misleading "_sync/ is out of date" message and an unreviewed-diff
    # "fix". A future contributor: widening this back to a range reopens
    # exactly that failure mode; bump it deliberately, in its own commit,
    # with --check re-run and any resulting _sync/ diff reviewed by hand.
    "unasync==0.6.0",
    # Pinned for the same reason as unasync above: it is the library that
    # actually re-tokenizes and reconstructs source bytes on unasync's
    # behalf (unasync.Rule._unasync_file calls tokenize_rt.src_to_tokens /
    # tokens_to_src directly), and unasync 0.6.0's own dependency on it is
    # unbounded. Pinning only unasync would still leave the byte-equality
    # gate resting on an unpinned transitive dependency.
    "tokenize-rt==6.2.0",
]

docs = [
    "numpydoc>=1.8",
    "sphinx>=7.2,<8.2",
    "sphinx-rtd-theme>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["easyvista_python_client"]

[tool.hatch.build.targets.sdist]
# Neither test suite ships. `integration_tests/` and `scripts/` simply never
# appear in the include list below, so they cannot end up in the tarball --
# no allowlist entry, no inclusion. The unit tests are different: they now
# live inside `/easyvista_python_client`, which the allowlist below DOES
# include wholesale, so this list is not what keeps them out. That job falls
# to the `**/tests/` and `**/testing/` entries in `[tool.hatch.build] exclude`
# above, which strip the test files back out after the include pass pulls the
# package tree in. Both stay in git either way, where anyone who wants to run
# them clones the repo — which `integration_tests/` requires anyway, since it
# needs a real instance and credentials no installer has. Nothing is lost on
# install: pip builds a wheel from this sdist and installs that, so tests
# never reached site-packages either way. The accepted cost is that a
# downstream packager building from the tarball cannot run the suite. Matches
# glpi_python_client.
include = [
    "/easyvista_python_client",
    "/docs",
    "/skills",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/.pre-commit-config.yaml",
    "/.readthedocs.yaml",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# The sync client tree is generated by unasync_build.py from _async/ and must
# stay byte-identical to what regeneration produces -- that identity is what
# the CI gate checks. The conflict is narrow but permanent: stripping the
# async and await keywords shortens lines, so a signature that had to be
# wrapped in the async source now fits on one line, and unasync keeps the
# wrapping. `ruff format` unwraps it and the next build re-wraps it, so
# without this exclusion the formatter and the generator fight forever and
# --check fails after every `pre-commit run`. Style is enforced on the
# hand-written source this tree comes from; mypy still checks it.
extend-exclude = ["easyvista_python_client/_sync"]
[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "integration_tests/", "testing/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["easyvista_python_client", "scripts", "integration_tests"]
addopts = "--cov=easyvista_python_client --cov-report=term-missing"
# --strict-markers / --strict-config are passed on CI's command line, NOT here:
# in `addopts` pytest 9 silently ignores them (they are parsed as ini overrides,
# which are harvested before addopts is prepended), so they would look like a
# gate while doing nothing. Verified: a typo'd marker errors from the command
# line and passes with a warning from addopts.
markers = [
    "integration: live tests against a real EasyVista instance (skipped unless env configured)",
]

[tool.coverage.run]
# Test modules now live inside the package, so `--cov=easyvista_python_client`
# would measure them too. They execute end to end and report ~100%, which would
# weigh ~6,700 lines of test code against ~2,700 lines of source and dilute the
# fail_under gate below into one that passes on almost anything.
omit = [
    "*/tests/*",
    "*/testing/*",
    # The async tree is the hand-written source; the sync modules below are
    # generated from it by a token transform that only strips async/await, so
    # every statement exists in both and measuring both would count the same
    # logic twice behind a doubled denominator. Coverage is reported on the
    # source, so an uncovered line always names a file someone can go edit.
    # Correspondence between the trees is enforced elsewhere: unasync_build.py
    # --check proves they match, mypy strict checks both, and the
    # test_concurrency.py pair exercises what exists on only one side.
    #
    # These are listed one by one rather than as `_sync/*` on purpose. That
    # glob also swallowed _sync/_concurrency.py, which is NOT generated -- it
    # is one of the two HAND_WRITTEN twins, the one module here that is
    # genuinely different code rather than a transform of its async twin. It
    # was the only hand-written module in the package measured by nothing.
    # (_sync/tests/* is already covered by the */tests/* entry above.)
    #
    # An added generated module that nobody lists here is a safe failure: it
    # dilutes the ratio slightly. It is not the ruff situation, where a missed
    # entry would put the formatter back in a fight with the generator. Even
    # so, test_unasync_codegen.py asserts this list matches what
    # unasync_build._source_files() actually generates, so the drift is caught.
    "easyvista_python_client/_sync/__init__.py",
    "easyvista_python_client/_sync/_transport.py",
    "easyvista_python_client/_sync/client.py",
]

[tool.coverage.report]
fail_under = 95
