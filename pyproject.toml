[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Hatchling decides sdist contents from the ROOT .gitignore only — it reads
# neither nested .gitignore files nor the user's global ignore file. Relying on
# that default previously swept local agent state and internal notes into the
# artifact, so the manifest is pinned explicitly here: `exclude` below is a
# belt-and-braces backstop, and the sdist `include` further down is an
# allowlist. A PyPI upload cannot be taken back, so nothing ships by accident.
[tool.hatch.build]
ignore-vcs = false
skip-excluded-dirs = true
exclude = [
    "__pycache__/",
    "*.py[cod]",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
    "build/",
    "dist/",
    "*.egg-info/",
    "docs/_build/",
    ".venv/",
    "venv/",
    ".env",
    ".env.*",
    "secrets/",
    ".claude/",
    ".superpowers/",
    "docs/superpowers/",
    "scripts/",
]

[project]
name = "easyvista-python-client"
version = "0.1.0"
description = "Typed Python client for the EasyVista Service Manager REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "easyvista-python-client contributors" }]
keywords = ["easyvista", "itsm", "service-manager", "api", "client", "rest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "tenacity>=8.2",
    "typing-extensions>=4.7; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/baraline/easyvista_python_client"
Documentation = "https://easyvista-python-client.readthedocs.io/en/latest/"
Issues = "https://github.com/baraline/easyvista_python_client/issues"
Source = "https://github.com/baraline/easyvista_python_client"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "numpydoc>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "vulture>=2.11",
    "pre-commit>=4.0",
    "sphinx>=7.2,<8.2",
    "sphinx-rtd-theme>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "twine>=5.1",
]

docs = [
    "numpydoc>=1.8",
    "sphinx>=7.2,<8.2",
    "sphinx-rtd-theme>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["easyvista_python_client"]

[tool.hatch.build.targets.sdist]
# Neither test suite ships. Both stay in git, where anyone who wants to run them
# clones the repo — which `integration_tests/` requires anyway, since it needs a
# real instance and credentials no installer has. Nothing is lost on install:
# pip builds a wheel from this sdist and installs that, so tests never reached
# site-packages either way. The accepted cost is that a downstream packager
# building from the tarball cannot run the suite. Matches glpi_python_client.
include = [
    "/easyvista_python_client",
    "/docs",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/.pre-commit-config.yaml",
    "/.readthedocs.yaml",
]

[tool.ruff]
line-length = 88
target-version = "py310"
[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "integration_tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "integration_tests"]
addopts = "--cov=easyvista_python_client --cov-report=term-missing"
# --strict-markers / --strict-config are passed on CI's command line, NOT here:
# in `addopts` pytest 9 silently ignores them (they are parsed as ini overrides,
# which are harvested before addopts is prepended), so they would look like a
# gate while doing nothing. Verified: a typo'd marker errors from the command
# line and passes with a warning from addopts.
markers = [
    "integration: live tests against a real EasyVista instance (skipped unless env configured)",
]

[tool.coverage.report]
fail_under = 95
