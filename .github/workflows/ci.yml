name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in step with the `Programming Language :: Python` classifiers in
        # pyproject.toml and with the same matrix in release.yml.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy easyvista_python_client
      # The sync client tree is generated from the async one and checked in.
      # This catches a _sync/ left stale by an edit to _async/. It does NOT
      # catch a token collision -- that is deterministic, so regenerating
      # reproduces it and the diff stays clean.
      # testing/test_unasync_codegen.py covers that case.
      - run: python unasync_build.py --check
      # `ruff check .` above skips easyvista_python_client/_sync/ wholesale, so
      # the two HAND_WRITTEN twins living in that tree are linted by nothing
      # else in CI. --check makes this report rather than reformat: the plain
      # form calls `ruff format`, which writes, and a job that silently fixes
      # the tree it is auditing would pass on files it had just repaired.
      - run: python scripts/lint_hand_written_sync.py --check
      # `integration_tests/` calls a real EasyVista instance using credentials the
      # user supplies; it can never run here. Excluded by marker rather than left
      # to skip on absent credentials, so a leaked secret could not make CI go
      # live. The marker is applied by location in integration_tests/conftest.py,
      # so a new file cannot escape it by forgetting `pytestmark`.
      # --strict-markers/--strict-config must be passed here, not in addopts,
      # where pytest 9 silently ignores them.
      - run: pytest -m "not integration" --strict-markers --strict-config

  coverage:
    # The 95% floor in `[tool.coverage.report] fail_under` used to be enforced
    # only because `--cov` sat in pytest's `addopts`, which made every run --
    # including a one-file local run -- measure the whole package and fail. Now
    # that addopts is clean, THIS job is where the floor is actually asserted;
    # delete it and fail_under becomes a number nothing reads. `needs: test`
    # keeps the failure legible: a broken test reports as a broken test on five
    # Python versions, not as an under-coverage number here.
    #
    # One version, not the matrix: coverage of this package does not vary by
    # interpreter (there is no version-gated code), so five runs would produce
    # five identical percentages, five uploads, and a Codecov report whose
    # totals depend on which one landed last.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # --cov-fail-under duplicates `[tool.coverage.report] fail_under` on
      # purpose: the flag is what a reader of this file can see is enforced,
      # and it also survives someone commenting the config value out.
      - run: >-
          pytest -m "not integration"
          --strict-markers --strict-config
          --cov=easyvista_python_client
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=95
      # `fail_ci_if_error: false` so a Codecov outage, or this repository not
      # being wired up on codecov.io yet, cannot turn a green suite red. The
      # gate that must not be skippable is --cov-fail-under above, which runs
      # before this and needs no third party. Without a CODECOV_TOKEN secret
      # the upload simply no-ops and the README badge reads "unknown".
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-audit:
    # Before the test co-location refactor, "tests never ship" was structural:
    # the unit tests lived outside `packages = ["easyvista_python_client"]`, so
    # the wheel could not physically contain them. Now they live inside that
    # tree and are kept out only by two glob patterns in
    # `[tool.hatch.build] exclude` (`**/tests/`, `**/testing/`) in
    # pyproject.toml. Nothing else in this workflow builds a package, so a
    # future edit that narrows or removes those globs would go unnoticed here
    # and publish the entire test suite to PyPI on the next release -- an
    # upload that cannot be taken back. This job builds both artifacts on
    # every push and PR and asserts neither manifest contains a tests/ or
    # testing/ path, so that regression fails CI instead of surfacing after
    # publish. It is a separate job (not another step in the matrix above) so
    # it builds and audits once rather than once per Python version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: |
          python -c "import glob, tarfile, zipfile; w = sorted(glob.glob('dist/*.whl'))[-1]; s = sorted(glob.glob('dist/*.tar.gz'))[-1]; names = zipfile.ZipFile(w).namelist() + tarfile.open(s).getnames(); bad = [n for n in names if '/tests/' in n or '/testing/' in n or n.endswith('/tests') or n.endswith('/testing')]; print('offenders:', bad); assert not bad, bad; print('OK - no test files in either artifact')"
      # The inverse of the assertion above: _sync/ is generated and gitignore-
      # shaped mistakes happen, so prove the generated tree -- not just the
      # hand-written one -- actually ships. A package missing its sync client
      # would otherwise import fine and fail only when a caller instantiates
      # EasyvistaClient. Checked against both artifacts, not just the wheel:
      # a downstream packager can build from the sdist, and the wheel-only
      # version of this assertion would miss a _sync/ that never made it into
      # the sdist in the first place.
      - run: |
          python - <<'PY'
          import pathlib, tarfile, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          artifacts = {
              wheel.name: zipfile.ZipFile(wheel).namelist(),
              sdist.name: tarfile.open(sdist).getnames(),
          }
          for name, names in artifacts.items():
              assert any(n.endswith("_sync/client.py") for n in names), (
                  f"the generated sync client is missing from {name} -- is "
                  "_sync/ gitignored or unbuilt?"
              )
              assert any(n.endswith("_async/client.py") for n in names), (
                  f"the async client is missing from {name}"
              )
          print("both client trees ship:", ", ".join(artifacts))
          PY
      # The sdist manifest is an allowlist, so `/skills` shipping is a single
      # line someone can delete without noticing -- and the wheel boundary is
      # the only thing keeping the skills OUT of an installed package. Assert
      # both directions here, next to the assertions that already guard the
      # test suite and the generated sync tree.
      - run: |
          python - <<'PY'
          import pathlib, tarfile, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          sdist_names = tarfile.open(sdist).getnames()
          wheel_names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("skills/README.md") for n in sdist_names), (
              "skills/ is missing from the sdist -- is '/skills' still in the "
              "[tool.hatch.build.targets.sdist] include allowlist?"
          )
          # The index alone shipping would satisfy the assertion above while
          # every skill it indexes was missing, so count them: one SKILL.md
          # per skill directory on disk, no more and no fewer.
          skills_dir = pathlib.Path("skills")
          on_disk = sorted(p.name for p in skills_dir.iterdir() if p.is_dir())
          shipped = sorted(n for n in sdist_names if n.endswith("/SKILL.md"))
          assert len(shipped) == len(on_disk), (
              f"the sdist carries {len(shipped)} SKILL.md files but skills/ has "
              f"{len(on_disk)} directories on disk ({on_disk}); shipped: {shipped}"
          )
          leaked = [n for n in wheel_names if "skills/" in n]
          assert not leaked, f"skills/ leaked into the wheel: {leaked}"
          print(f"skills/ ships in the sdist only ({len(shipped)} SKILL.md)")
          PY
