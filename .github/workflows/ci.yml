name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy easyvista_python_client
      # `integration_tests/` calls a real EasyVista instance using credentials the
      # user supplies; it can never run here. Excluded by marker rather than left
      # to skip on absent credentials, so a leaked secret could not make CI go live.
      - run: pytest -m "not integration"
